name: Publish to npm

on:
    push:
        branches:
            - master

concurrency:
    group: npm-release-master
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Check out master
              uses: actions/checkout@v6
              with:
                  ref: master
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify package
              run: |
                  bun run typecheck
                  bun test
                  bun run verify:package

            - name: Select release version
              id: version
              shell: bash
              run: |
                  package_name="$(node -p "require('./package.json').name")"
                  current_version="$(node -p "require('./package.json').version")"
                  published_versions="$(npm view "$package_name" versions --json)"

                  if PUBLISHED_VERSIONS="$published_versions" CURRENT_VERSION="$current_version" node -e '
                    const versions = JSON.parse(process.env.PUBLISHED_VERSIONS);
                    process.exit([versions].flat().includes(process.env.CURRENT_VERSION) ? 0 : 1);
                  '; then
                    version="$(npm version patch --no-git-tag-version)"
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                    version="v$current_version"
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Commit and tag version
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  VERSION_CHANGED: ${{ steps.version.outputs.changed }}
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  if [[ "$VERSION_CHANGED" == "true" ]]; then
                    git add package.json
                    git commit -m "chore(release): ${VERSION}"
                  fi

                  if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
                    if [[ "$(git rev-list -n 1 "$VERSION")" != "$(git rev-parse HEAD)" ]]; then
                      echo "Tag $VERSION already exists on a different commit" >&2
                      exit 1
                    fi
                  else
                    git tag --annotate "$VERSION" --message "Release $VERSION"
                  fi

                  git push origin HEAD:master "$VERSION"

            - name: Publish package
              run: npm publish
              timeout-minutes: 5
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
